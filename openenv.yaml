# OpenEnv manifest — required by the hackathon and by the OpenEnv spec.

name: ast-code-edit
version: 0.2.0
description: >
  AST-based code-editing environment where an agent fills in stub Python
  functions guided by a DAG representation of the module
  (nodes = module / function / class / import;
   edges = contains / calls / imports).
  The agent is trained with GRPO + LoRA to maximise a reward combining
  compilation success and test-case pass rate.

client:
  class_name: ASTCodeEditEnv
  module: env.client

action:
  class_name: CodeEditAction
  module: env.models

observation:
  class_name: CodeEditObservation
  module: env.models

state:
  class_name: CodeEditState
  module: env.models

environment:
  class_name: ASTCodeEditEnvironment
  module: env.environment

default_image: ast-code-edit:latest
spec_version: 1

tags:
  - code-generation
  - ast
  - dag
  - grpo
  - lora
  - rl
  - python
  - single-step

author: "Naga Nithin"
license: MIT
homepage: "https://github.com/nithin062006/scaler"
