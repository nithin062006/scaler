# OpenEnv manifest — required by the hackathon and by the OpenEnv spec.
# https://meta-pytorch.org/OpenEnv/guides/environment-anatomy.html

name: graphforge
version: 0.1.0
description: >
  Graph-first code generation environment for long-horizon RL planning.
  The agent constructs Python programs by mutating a typed function-call
  graph; source files are a deterministic projection of the canonical
  graph. Tasks reward correct architecture, type-flow, materialization,
  and behavioral conformance — not just final source matching.

# Where the OpenEnv harness should look for client / action / observation
# classes when introspecting the package.
client:
  class_name: GraphForgeEnv
  module: env.client

action:
  class_name: GraphForgeAction
  module: env.models

observation:
  class_name: GraphForgeObservation
  module: env.models

state:
  class_name: GraphForgeState
  module: env.models

environment:
  class_name: GraphForgeEnvironment
  module: env.environment

# Container image used for deployment (HF Space build will tag this).
default_image: graphforge:latest

# OpenEnv manifest schema version.
spec_version: 1

# Tags to aid discovery in the OpenEnv hub.
tags:
  - code-generation
  - long-horizon-planning
  - rl
  - tool-use
  - sparse-reward
  - python

# Author + license metadata.
author: "Naga"
license: MIT
homepage: "https://github.com/"  # filled in once repo is published
